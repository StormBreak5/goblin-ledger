version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: goblinledger-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-goblin}
      POSTGRES_PASSWORD: ${DB_PASS:-goblin_password}
      POSTGRES_DB: ${DB_NAME:-goblinledger}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-goblin} -d ${DB_NAME:-goblinledger}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # CU02-C2: servidor SMTP de desenvolvimento. Recebe o e-mail de recuperação de senha sem enviá-lo de verdade;
  # as mensagens ficam em http://localhost:8025. Em produção, configure SMTP_* no .env.
  mailpit:
    image: axllent/mailpit:latest
    container_name: goblinledger-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goblinledger-worker
    restart: always
    env_file:
      - .env
    environment:
      # Sobrescreve DB_HOST/DB_PORT para usar o hostname e a porta internos do docker network:
      # o .env traz a porta publicada no host (5435), mas dentro da rede o Postgres escuta em 5432.
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
