version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: goblinledger-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-goblin}
      POSTGRES_PASSWORD: ${DB_PASS:-goblin_password}
      POSTGRES_DB: ${DB_NAME:-goblinledger}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-goblin} -d ${DB_NAME:-goblinledger}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # CU02-C2: servidor SMTP de desenvolvimento. Recebe o e-mail de recuperação de senha sem enviá-lo de verdade;
  # as mensagens ficam em http://localhost:8025. Em produção, configure SMTP_* no .env.
  mailpit:
    image: axllent/mailpit:latest
    container_name: goblinledger-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goblinledger-worker
    restart: always
    env_file:
      - .env
    environment:
      # Sobrescreve DB_HOST/DB_PORT para usar o hostname e a porta internos do docker network:
      # o .env traz a porta publicada no host (5435), mas dentro da rede o Postgres escuta em 5432.
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  # CU11: treino e avaliação do modelo preditivo global (pandas + TensorFlow). Consome a fila de treinamentos que a
  # API registra (POST /api/admin/model-training). Os artefatos de cada versão ficam em ./modelos/v{versao}.
  modelo:
    build:
      context: .
      dockerfile: Dockerfile.modelo
    container_name: goblinledger-modelo
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      MODELO_PASTA: /app/modelos
    volumes:
      - ./modelos:/app/modelos
    depends_on:
      db:
        condition: service_healthy

  # Testes do pipeline do CU11 (precisam do TensorFlow): docker compose run --rm modelo-testes
  modelo-testes:
    build:
      context: .
      dockerfile: Dockerfile.modelo
    profiles: ["testes"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg2://${DB_USER:-goblin}:${DB_PASS:-goblin_password}@db:5432/${DB_NAME:-goblinledger}
    volumes:  # o código e os testes da pasta de trabalho, sem precisar reconstruir a imagem
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
    command: ["python", "-m", "pytest", "-p", "no:cacheprovider", "tests/modelo"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
