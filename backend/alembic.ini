# Uso pela linha de comando, a partir de backend/ (com DB_HOST, DB_PORT etc. no ambiente):
#   alembic upgrade head
#   alembic revision --autogenerate -m "descricao"
# Em execução normal, src.repositories.database.init_db() aplica as migrações sozinho.

[alembic]
script_location = %(here)s/src/migrations
prepend_sys_path = .
# A URL do banco vem de src.repositories.database.get_database_url() (variáveis DB_*).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
